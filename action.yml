name: swarm-review
description: Review a pull request with Workers AI lanes and publish the confirmed findings as a pull request review.

inputs:
  workers-ai-api-key:
    description: A Cloudflare API token with Workers AI access. Without `cloudflare-account-id` it must reach exactly one account, which is the one billed.
    required: true
  cloudflare-account-id:
    description: The account the key bills, for a key that cannot list its own account.
    default: ""
  pull-request:
    description: The pull request to review.
    default: ${{ github.event.issue.number || github.event.pull_request.number }}
  mode:
    description: Use sandbox lanes, packed lanes, or choose sandbox except for forks and runners that cannot run the sandbox image.
    default: auto

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: swarm-review-source
        fetch-depth: 0
        ref: refs/pull/${{ inputs.pull-request }}/head

    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: ${{ github.action_path }}/package.json

    - name: Install
      shell: bash
      working-directory: ${{ github.action_path }}
      run: bun install --frozen-lockfile

    - name: Review
      shell: bash
      env:
        WORKERS_AI_API_KEY: ${{ inputs.workers-ai-api-key }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        GITHUB_TOKEN: ${{ github.token }}
        PULL_REQUEST: ${{ inputs.pull-request }}
        INPUT_MODE: ${{ inputs.mode }}
      run: bun "$GITHUB_ACTION_PATH/src/action.ts"

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: swarm-review
        path: ${{ runner.temp }}/swarm-review
