name: swarm-review
description: Review a pull request with packed Workers AI lanes and publish the confirmed findings as a pull request review.

inputs:
  workers-ai-api-key:
    description: A Cloudflare API token with Workers AI access. It must reach exactly one account, which is the one billed.
    required: true
  pull-request:
    description: The pull request to review.
    default: ${{ github.event.issue.number || github.event.pull_request.number }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: swarm-review-source
        fetch-depth: 0

    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: ${{ github.action_path }}/package.json

    - name: Install
      shell: bash
      working-directory: ${{ github.action_path }}
      run: bun install --frozen-lockfile

    - name: Review
      shell: bash
      env:
        WORKERS_AI_API_KEY: ${{ inputs.workers-ai-api-key }}
        GITHUB_TOKEN: ${{ github.token }}
        PULL_REQUEST: ${{ inputs.pull-request }}
      run: |
        CLOUDFLARE_ACCOUNT_ID=$(curl -fsS -H "authorization: Bearer $WORKERS_AI_API_KEY" https://api.cloudflare.com/client/v4/accounts \
          | jq -er 'if (.result | length) == 1 then .result[0].id else error("the key reaches \(.result | length) accounts, not one") end')
        export CLOUDFLARE_ACCOUNT_ID
        swarm_id="pr-$PULL_REQUEST-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        out="$RUNNER_TEMP/swarm-review"
        # A partial run still carries what its verifier confirmed, and publish
        # is what refuses a run that confirmed nothing.
        bun "$GITHUB_ACTION_PATH/src/swarm.ts" --repo "$GITHUB_REPOSITORY" \
          --source "$GITHUB_WORKSPACE/swarm-review-source" --pr "$PULL_REQUEST" \
          --provider cloudflare-workers-ai --model @cf/deepseek-ai/deepseek-v4-flash-0731 \
          --reviewers 3 --swarm-id "$swarm_id" --out "$out" || true
        bun "$GITHUB_ACTION_PATH/src/publish.ts" --receipt "$out/$swarm_id/swarm-receipt.json" \
          --repo "$GITHUB_REPOSITORY" --pr "$PULL_REQUEST" --publish

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: swarm-review
        path: ${{ runner.temp }}/swarm-review
